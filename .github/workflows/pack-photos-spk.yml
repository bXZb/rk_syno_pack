name: Photos OEC NPU overlay bundle

on:
  workflow_dispatch:
    inputs:
      photos_version:
        description: Official Photos SPK version (model/lib source)
        required: false
        default: '1.9.1-10928'
  push:
    paths:
      - '.github/workflows/pack-photos-spk.yml'
      - 'scripts/pack-photos-overlay.sh'
      - 'scripts/prepare-photos-rknn.sh'
      - 'scripts/convert-photos-rknn.py'
      - 'tools/photos-npu/**'
  pull_request:
    paths:
      - '.github/workflows/pack-photos-spk.yml'
      - 'scripts/pack-photos-overlay.sh'
      - 'scripts/prepare-photos-rknn.sh'
      - 'scripts/convert-photos-rknn.py'
      - 'tools/photos-npu/**'

concurrency:
  group: pack-photos-spk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PHOTOS_VERSION: ${{ github.event.inputs.photos_version || '1.9.1-10928' }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install convert deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libsodium-dev libmsgpack-dev xz-utils curl unzip file git

      - name: Test npu_server
        working-directory: tools/photos-npu
        run: go test ./...

      - name: Convert RKNN + extract librknnrt
        run: |
          chmod +x scripts/prepare-photos-rknn.sh scripts/pack-photos-overlay.sh scripts/convert-photos-rknn.py
          scripts/prepare-photos-rknn.sh \
            --photos-version "${PHOTOS_VERSION}" \
            --out-dir build/photos-rknn \
            --install-deps
          echo '--- rknn dir ---'
          ls -lh build/photos-rknn
          test -f build/photos-rknn/librknnrt.so
          test -f build/photos-rknn/concept_network.rknn
          test -f build/photos-rknn/detection_network.rknn
          test -f build/photos-rknn/feature_network.rknn
          file build/photos-rknn/librknnrt.so

      - name: Assemble overlay bundle
        env:
          RKNN_DIR: ${{ github.workspace }}/build/photos-rknn
        run: |
          scripts/pack-photos-overlay.sh output/dsm/photos-npu-overlay.tar.gz

      - name: Verify bundle
        run: |
          set -euo pipefail
          ls -lh output/dsm/photos-npu-overlay.tar.gz
          mkdir -p build/verify && tar -xzf output/dsm/photos-npu-overlay.tar.gz -C build/verify
          cd build/verify
          python3 - <<'PY'
          import os
          wanted = [
              "apply-oec-npu.sh",
              "oec-enable-npu.sh",
              "README.txt",
              "npu/npu_server",
              "npu/run_server.sh",
              "npu/npu_model_conf.json",
              "npu/asset/labels.txt",
              "npu/asset/thresholds.txt",
              "npu/asset/network/concept_network.rknn",
              "npu/asset/network/detection_network.rknn",
              "npu/asset/network/feature_network.rknn",
              "npu/lib_arm64/librknnrt.so",
          ]
          for w in wanted:
              assert os.path.isfile(w), "missing " + w
          server = open("npu/npu_server", "rb").read()
          assert server[:4] == b"\x7fELF" and server[18] == 0xb7, "npu_server not arm64 ELF"
          for s in [b"concept top:", b"ConceptDetectBuffer"]:
              assert s in server, "npu_server missing marker " + repr(s)
          for f in ["apply-oec-npu.sh", "oec-enable-npu.sh", "npu/run_server.sh"]:
              body = open(f, encoding="utf-8").read()
              assert body.startswith("#!/bin/sh"), f + " must be POSIX sh"
          hook = open("oec-enable-npu.sh").read()
          for marker in ["-c /dev/rknpu", "/usr/local/oec-npu", "setsid", "SkipMemoryCheck"]:
              assert marker in hook, "hook missing " + marker
          assert "touch /dev/galcore" not in hook, "hook regressed to fake galcore"
          apply = open("apply-oec-npu.sh").read()
          for marker in ["concept_threshold", "synofoto-bin-regenerate-many-unit-has-many-concept",
                         "start-stop-status", "npu-stock-backup"]:
              assert marker in apply, "apply script missing " + marker
          print("bundle OK: arm64 server + 3 RKNN models + v7 hook + POSIX scripts")
          PY

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Photos OEC NPU overlay bundle"
            echo
            echo "Prereq: official (signed) SynologyPhotos installed on the box."
            echo "On the box (root, from the extracted dir):"
            echo
            echo '```'
            echo "sudo sh apply-oec-npu.sh"
            echo '```'
            echo
            echo "Re-run after any SynologyPhotos package upgrade."
            if [ -f build/photos-rknn/MANIFEST.txt ]; then
              echo "### Converted bits"
              echo '```'
              cat build/photos-rknn/MANIFEST.txt
              echo '```'
            fi
            ls -lh output/dsm/photos-npu-overlay.tar.gz 2>/dev/null || true
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: photos-npu-overlay
          path: |
            output/dsm/photos-npu-overlay.tar.gz
            build/photos-rknn/MANIFEST.txt
          if-no-files-found: error
          retention-days: 30
